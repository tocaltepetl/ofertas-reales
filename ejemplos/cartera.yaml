# Cartera de ejemplo: todas las tarjetas del catálogo, con los MSI que ofrecía el
# refrigerador Midea Side by Side ($12,987) en Mercado Libre. Copia este archivo y deja
# solo lo que tengas.
instrumentos:
  - mercadopago.tdc
  - mercadopago.credito
  - mercadopago.saldo
  - banamex.tdc
  - santander.tdc
  - bbva.tdc
  - hsbc.tdc
  - banorte.tdc
  - banorte.tdd
  - amex.tarjeta
  - oxxo.efectivo
  - scotiabank.tdc
  - scotiabank.tdd
  - afirme.tdc
  - invex.tdc
  - openbank.tdc
  - mifel.tdc
  - falabella.tdc
  - bancoppel.tdc
  - bancoppel.tdd
  - nu.tdc
  - didi.tarjeta
  - klar.tdc
  # Tarjetas de tienda y otras (quita las que no tengas)
  - liverpool.tarjeta
  - palacio.tarjeta
  - invex.walmart
  - banamex.homedepot
  - hey.tdc
  - rappi.tdc
  - kueski.pay
  - paypal.cuenta

atributos:
  banamex_productos_extra: 1
  hsbc_segmento: otro

# MSI máximos que ofrece ESTE producto con cada tarjeta (revisa "Ver los medios de pago")
msi:
  mercadopago.tdc: 24
  banamex.tdc: 12
  santander.tdc: 12
  bbva.tdc: 15
  hsbc.tdc: 15
  banorte.tdc: 12
  amex.tarjeta: 12
  scotiabank.tdc: 12
  afirme.tdc: 12
  mifel.tdc: 3
  falabella.tdc: 3
  bancoppel.tdc: 12
  nu.tdc: 3

# MSI distintos en un comercio concreto
msi_por_comercio:
  homedepot: { banamex.homedepot: 24, banamex.tdc: 18, bbva.tdc: 18, santander.tdc: 18, hsbc.tdc: 18 }
  walmart: { invex.walmart: 18, bbva.tdc: 18 }
  liverpool: { liverpool.tarjeta: 18, bbva.tdc: 18, banamex.tdc: 18 }
  palacio-de-hierro: { palacio.tarjeta: 18 }

# Lo que ya compraste en el evento, por campaña (suma a mínimos acumulados y descuenta topes por cliente)
acumulados:
  hsbc-bf26-devolucion: { compras: 0, beneficio: 0 }

rendimiento_anual: 10
