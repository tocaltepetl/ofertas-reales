  - id: cp-bancoppel-tdc
    nombre: Bonificación BanCoppel (crédito) + 5% adicional en Coppel
    comercio: coppel
    patrocinador: bancoppel
    campana: bancoppel-bf26-bonificacion-tdc
    instrumentos: [bancoppel.tdc]
    beneficio:
      tipo: bonificacion
      tope: 2200
      certeza: condicionado
      tramos:
        - {mayor_a: 8500, pct: 25}
        - {mayor_a: 4500, pct: 20}
        - {desde: 3000, pct: 15}
      escala_acumulada: true
    condiciones:
      registro_previo: App BanCoppel
    avisos:
      - "Tramos base 10/15/20% por compras acumuladas con BanCoppel en cualquier comercio, +5% sobre lo comprado en Coppel (ya sumado aquí)"
      - "El tope de $2,200 incluye el 5% adicional; el 5% solo se paga si alcanzas la meta base"
      - "Sujeta a una bolsa de $3.56 M que se reparte primero a quien más acumula"
      - "Crédito y débito no se suman: una sola bonificación, sobre el producto con mayor monto"
      - "Compatible con los 3/6 MSI automáticos"
    fuente:
      url: "https://www.bancoppel.com/buen-fin/img/Buen_Fin_2026_TyC_VF.pdf"
      snapshot: snapshots/buen-fin-2026/banco-bancoppel-tyc/20261117-170500.txt
      capturada: 2026-11-17
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-17, resultado: coincide, notas: "T&C oficial de BanCoppel (PDF bajado a mano): tramos 10/15/20%, +5% sobre lo facturado en Coppel/coppel.com y tope de $2,200 que incluye el adicional ('Sujeto al tope máximo aplicable'). Antes dudosa con Promodescuentos como fuente"}
