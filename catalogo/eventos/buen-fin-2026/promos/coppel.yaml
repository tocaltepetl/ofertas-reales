      - "Mínimo por ticket individual, no acumulable; pagar 100% con línea de crédito (no saldo a favor) y sin sobregiro"
      - "Cuenta al corriente en los últimos 6 meses"
      - "Suma para la bonificación BanCoppel del Buen Fin si te registraste en la App BanCoppel"
    fuente:
      url: "https://imagescontentstack.coppel.com/v3/assets/blt81f564913ca7e893/blt36c7aa2c1b2b3b73/6af368cbf321bef7e38f9f8d/BanCoppel_20_5_MSI_TyC_BuenFin2026.pdf"
