# Promociones de Coppel (tiendas y coppel.com), Buen Fin 2026.
# Origen: coppel.com/inf/promociones-bancarias (5 pestañas, cada una con su PDF de T&C), capturada con Chrome
# el 17 nov 2026; los PDFs los bajó a mano el usuario (el CDN de Coppel rechaza curl y Chrome headless). revisada: false.
#
# La página bloquea curl (403). Los PDFs están en snapshots/buen-fin-2026/comercio-coppel-tyc/.
# Bonificación de BanCoppel (hasta 20% + 5% en Coppel, campañas bancoppel-bf26-*): T&C oficial en
# snapshots/buen-fin-2026/banco-bancoppel-tyc/ (bancoppel.com/buen-fin/img/Buen_Fin_2026_TyC_VF.pdf, 403 a scripts).
promociones:
  # ---------------- Crédito Coppel ----------------
  - id: cp-pago-inicial-0
    nombre: 0% de pago inicial con Crédito Coppel (ropa, zapatos, refrigeradores y lavadoras)
    comercio: coppel
    patrocinador: coppel
    instrumentos: [coppel.credito]
    beneficio:
      tipo: diferido
      descripcion: "Sin enganche: 0% de pago inicial al comprar a crédito; el crédito sigue cobrando intereses"
    condiciones:
      categorias: [ropa, calzado, accesorios, linea-blanca]
    avisos:
      - "Solo ropa y zapatos (incluye lencería, cuidado personal, juguetes, bebés, mascotas, blancos) y lavadoras y refrigeradores de cualquier marca"
      - "Excluye una lista de juguetes (Tabla A del PDF) y artículos de Marketplace o Coppel Pay; compra los de Marketplace por separado"
      - "Sin saldo vencido y con margen de crédito disponible"
      - "Tienda, app, coppel.com, kiosko, WhatsApp y teléfono"
    fuente:
      url: "https://imagescontentstack.coppel.com/v3/assets/blt81f564913ca7e893/bltb20c2fb9dfc10005/6af78ab377abc4cbf3d39c5a/0_Pago_inicial_TyC_BuenFin2026.pdf"
      snapshot: snapshots/buen-fin-2026/comercio-coppel-tyc/0_Pago_inicial_TyC_BuenFin2026.txt
      capturada: 2026-11-17
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-17, resultado: coincide}
      evidencia: "El beneficio es exclusivo para adquisiciones realizadas mediante el crédito Coppel en las categorías de ropa y zapatos"

  - id: cp-coppel-max-dinero-electronico
    nombre: 10% en Dinero Electrónico en tu primera compra en línea con Crédito Coppel
    comercio: coppel
    patrocinador: coppel
    instrumentos: [coppel.credito]
    vigencia: {desde: 2026-07-01, hasta: 2026-11-30}
    beneficio: {tipo: bonificacion, pct: 10, tope: 200, forma: monedero, certeza: condicionado}
    condiciones:
      minimo: {monto: 100}
      requiere: [coppel_primera_compra_digital]
    avisos:
      - "Solo la primera compra en coppel.com, coppel.com en tienda o App Coppel; no en tienda física"
      - "No aplica a clientes con domicilio en BCS, Colima, SLP ni Quintana Roo"
      - "1% al instante y 9% hasta 10 días hábiles después; el Dinero Electrónico vence a los 12 meses"
      - "No acumulable con otras promos de Dinero Electrónico; excluye Marketplace y Coppel Pay"
      - "Hasta agotar el presupuesto de la campaña; no es exclusiva del Buen Fin (1 jul al 30 nov)"
    fuente:
      url: "https://imagescontentstack.coppel.com/v3/assets/blt81f564913ca7e893/bltcc7d9bb31ce86f85/6af368fb7c35acfb612f9b01/10_Dinero_Electronica_TyC_BuenFin2026.docx.pdf"
      snapshot: snapshots/buen-fin-2026/comercio-coppel-tyc/10_Dinero_Electronica_TyC_BuenFin2026.docx.txt
      capturada: 2026-11-17
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-17, resultado: coincide}
      evidencia: "La presente promoción tendrá un tope máximo de bonificación en Dinero Electrónico de $200."

