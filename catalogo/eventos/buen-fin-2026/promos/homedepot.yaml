# Promociones bancarias de The Home Depot México, Buen Fin 2026.
# Origen: homedepot.com.mx/promociones-bancarias y sus T&C (condiciones-promociones-meses-sin-intereses-en-linea),
# capturadas el 16 nov 2026; mecánicas generales cotejadas con las páginas de cada banco. revisada: false.
#
# Plazos MSI que ofrece la tienda (T&C "Toda La Tienda hasta 24 MSI"; son disponibilidad de plan, no beneficio):
#   6, 12 y 18 MSI con casi todos los bancos; 13 MSI solo BBVA; 15 MSI solo Banamex; 24 MSI solo TDC The Home Depot Banamex.
#   Mínimos: 6 MSI $6,500 · 12 MSI $8,500 · 13 MSI $10,000 · 15 MSI $10,500 · 18 MSI $12,500 · 24 MSI $13,500.
#   En MSI no participan materiales básicos de construcción (varilla, castillos/malla, alambres, cemento, block, barro).
#
# Promos vía PayPal (sección PayPal de los T&C): se modelan con instrumentos: [paypal.cuenta] + condiciones.fondeo.
#   PayPal en homedepot.com.mx: 3, 4, 6, 9 y 12 MSI, mínimo $10,000 para MSI; no aplica con débito en línea.
promociones:
  # ---------------- Banamex ----------------
  - id: hd-banamex-bonificacion
    nombre: Hasta 30% de bonificación Banamex desde 12 MSI
    comercio: homedepot
    patrocinador: banamex
    campana: banamex-bf26-bonificacion
    instrumentos: [banamex.tdc, banamex.homedepot]
    beneficio:
      tipo: bonificacion
      tope: 10000
      forma: estado_de_cuenta
      tramos:
        - {atributos: {banamex_productos_extra: 3}, pct: 30}
        - {atributos: {banamex_productos_extra: 2}, pct: 20}
        - {atributos: {banamex_productos_extra: 1}, pct: 15}
        - {pct: 10}
      escala_acumulada: true
    condiciones:
      minimo: {monto: 10000, acumulable: true}
      plazos: {min: 12}
      registro_previo: App Banamex o banamex.com/buenfin (del 3 al 17 nov; solo cuentan compras posteriores al registro)
    avisos:
      - "El mínimo de $10,000 es acumulado en negocios participantes a 12+ MSI (todas tus TDC Banamex)"
      - "Tope de $10,000 por cliente en todo el Buen Fin Banamex, incluidas las Horas Banamex"
      - "Se refleja a más tardar 60 días hábiles después del 17 nov"
      - "MSI en Home Depot: hasta 18 con TDC Banamex (15 MSI exclusivo Banamex); hasta 24 con TDC The Home Depot Banamex"
      - "No participan TDC Corporativas, Costco ni Negocios (PyME); los T&C de la tienda excluyen genéricamente 'marca privada', pero el anuncio incluye la TDC The Home Depot Banamex"
      - "Excluye materiales básicos de construcción"
    fuente:
      url: "https://www.homedepot.com.mx/condiciones-promociones-meses-sin-intereses-en-linea"
      snapshot: snapshots/buen-fin-2026/comercio-homedepot-tyc/20261116-151221.txt
      capturada: 2026-11-16
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-16, resultado: coincide}
