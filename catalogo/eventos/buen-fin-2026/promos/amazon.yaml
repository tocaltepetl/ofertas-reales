# Origen: amazon.com.mx/b?node=120273989011 ("Promociones Bancarias"), capturada el 16 nov 2026 15:11.
# Las condiciones (mínimos y topes) vienen de los modales "Conoce más" (archivo .modales.txt).
# Las tarjetas llevan logo, pero los modales no siempre nombran al banco: DiDi, Rappi, Klar, Falabella y Revolut
# se asignaron por el orden (inverso) de los modales y por coincidencia de cifras; la tarjeta de BNRTBF26 tiene alt "Access logo".
# En la recaptura del 17 nov (20261117-162130.render.html) cada modal lleva su botón "Ver Términos y Condiciones" con
# ref_=BANKP_F_button_<Banco>_..._bf_2026 y un node propio: eso confirma el banco de cada modal (Banorte, Rappi, Revolut, DiDi, Klar...).
# Amazon Access (cupón ACCESSBF26, 20% en la primera compra, mínimo $900, tope $500) no se incluye: falta el instrumento.
# Cuando Amazon solo resume una promoción general del banco, la mecánica viene del snapshot del banco (fuente.nota).
# Regla de Amazon (T&C del cupón SCOTBF26): los cupones bancarios NO se combinan con otros códigos promocionales.
