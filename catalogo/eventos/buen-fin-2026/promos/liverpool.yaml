# Promociones bancarias y de medios de pago de Liverpool, Buen Fin 2026.
# Origen: liverpool.com.mx/tienda/paginas/buenfin ("Descubre los beneficios que cada banco tiene para ti",
# 10 tarjetas; el banco de cada una sale de la imagen en el .render.html) capturada el 16 nov 2026, más
# las páginas de cada banco (snapshots banco-*), citadas en fuente.nota. Los T&C PDF de Liverpool
# (rest_*_131126.pdf) no se capturaron.
#
# Vigencia: cada tarjeta dice "Válido al: 17/11/26" y los bancos dicen 13 al 17 nov, así que se deja la
# del evento; el texto al pie de la página habla de descuentos "del 13 al 16 de noviembre".
#
# No se capturan como promoción:
# - "Obtén 15% de cashback con tu tarjeta Activa Liverpool": no existe el instrumento (débito Activa).
# - De "Con PayPal todo suma" (hasta 12 MSI + promociones de los bancos vía PayPal) se capturan, con
#   condiciones.fondeo, las de Banorte, Afirme, Banamex, HSBC, Santander y Liverpool Visa (pista-paypal-bancos).
#   No se capturan BBVA (hasta 15/16%, sin tope publicado), Falabella (15%, sin tope), DiDi, Nu (folios),
#   Scotiabank (ya cuenta como compra acumulada de la tarjeta) ni Klar (su T&C excluye PayPal).
promociones:
  # ---------------- Tarjetas Liverpool ----------------
  - id: lp-liverpool-cashback
    nombre: 10% cashback con Tarjetas Liverpool desde $12,500
    comercio: liverpool
    patrocinador: liverpool
    campana: liverpool-bf26-cashback
    instrumentos: [liverpool.tarjeta]
    beneficio: {tipo: cashback, pct: 10, certeza: condicionado}
    condiciones:
      minimo: {monto: 12500, acumulable: true}
    avisos:
      - "El mínimo de $12,500 puede ser en compras acumuladas"
      - "Tope, plazos participantes y forma de entrega desconocidos: el T&C (rest_cashbackLV_131126.pdf) no se capturó"
      - "Para Liverpool Visa vía PayPal, PayPal indica que hay que inscribirse en micredito.liverpool.com.mx"
    fuente:
      url: "https://www.liverpool.com.mx/tienda/paginas/buenfin"
      snapshot: snapshots/buen-fin-2026/comercio-liverpool/20261116-145101.txt
      capturada: 2026-11-16
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-16, resultado: corregida, notas: "minimo pasa a acumulable: true con campana liverpool-bf26-cashback: la tarjeta de comercio-liverpool dice Acumulando compras de $12,500 o más. El tope y los plazos siguen sin conocerse (T&C rest_cashbackLV no capturado)"}
      evidencia: "Obtén 10% de cashback Acumulando compras de $12,500 o más con tus Tarjetas Liverpool"
      nota: "snapshots/buen-fin-2026/pista-paypal-bancos/20261116-145101.txt: Liverpool Visa \"inscríbete para participar por 10% de cashback* al acumular compras de $12,500\""

