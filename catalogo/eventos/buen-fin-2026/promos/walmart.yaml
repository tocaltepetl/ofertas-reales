# Promociones bancarias de Walmart México (walmart.com.mx), Buen Fin 2026.
# Origen: página "Promociones bancarias" (alt de los banners) y artículo de T&C de Walmart,
# capturados el 16 nov 2026. Cuando Walmart solo resume una promoción del banco, la mecánica
# exacta viene de la página del banco (ver fuente.nota). revisada: false hasta cotejarla a mano.
# No hay cupones vigentes: WB12EFI26 / WB18EFI26 (5–12 nov) ya vencieron y no se incluyen.
promociones:
  # ---------------- Walmart INVEX / Sam's Club INVEX ----------------
  - id: wm-invex-bonificacion
    nombre: Bonificación Walmart INVEX a 12 o 18 MSI
    comercio: walmart
    patrocinador: invex
    instrumentos: [invex.walmart, invex.sams]
    vigencia: {desde: 2026-11-05, hasta: 2026-11-18}
    beneficio:
      tipo: bonificacion
      forma: estado_de_cuenta
      tramos:
        - {dias: [2026-11-16], pct: 40, tope: 2000}
        - {dias: [2026-11-13, 2026-11-14, 2026-11-15, 2026-11-17], pct: 25, tope: 1250}
        - {dias: [2026-11-05, 2026-11-06, 2026-11-07, 2026-11-08, 2026-11-09, 2026-11-10, 2026-11-11, 2026-11-12, 2026-11-18], pct: 20, tope: 1000}
    condiciones:
      minimo: {monto: 5000}
      plazos: {permitidos: [12, 18]}
    exclusiva: true
    avisos:
      - "Solo productos participantes de walmart.com.mx (listado WM INVEX)"
      - "Tope por comercio: $2,000 el 16 nov; $1,250 el 13-15 y 17 nov; $1,000 el 5-12 y 18 nov"
      - "No acumulable con otras promociones, beneficios o descuentos; un cupón por usuario"
      - "Bonificación en máximo 30 días naturales tras la vigencia, en el siguiente estado de cuenta"
      - "El banner de Walmart dice WM INVEX; el T&C incluye también a la Tarjeta Sam's Club INVEX"
    fuente:
      url: "https://www.walmart.com.mx/ayuda/articulo/el-fin-irresistible-and-buen-fin-promociones-bancarias/172a059b988640b19ad75c639542df56"
      snapshot: snapshots/buen-fin-2026/comercio-walmart-tyc/20261116-151615.txt
      capturada: 2026-11-16
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-16, resultado: coincide}
      evidencia: "40% de bonificación en compras realizadas exclusivamente el 16 de noviembre de 2026."

  - id: wm-invex-meta
    nombre: Bonificación INVEX por meta personal (9+ MSI)
    comercio: walmart
    patrocinador: invex
    instrumentos: [invex.tdc, invex.walmart, invex.sams]
    beneficio: {tipo: bonificacion, pct: 10, certeza: condicionado, forma: estado_de_cuenta}
    condiciones:
      plazos: {min: 9}
      requiere: [invex_meta]
      registro_previo: Activar del 12 al 17 nov por los canales de INVEX (correo / INVEX Now)
    excluye: [wm-invex-bonificacion]
    avisos:
      - "Promoción general de INVEX (no exclusiva de Walmart); solo clientes que recibieron el correo"
      - "El mínimo y el tope son personales (meta notificada por correo); no se conocen"
      - "No acumulable con la bonificación exclusiva Walmart INVEX / Sam's Club INVEX"
      - "No se modela el 5% adicional a una sola exhibición (requiere además una compra a 9+ MSI)"
    fuente:
      url: "https://www.invextarjetas.com.mx/invex/Documentos/Landings/TerminosyCondicionesBuenFin2026.pdf"
      snapshot: snapshots/buen-fin-2026/banco-invex-tyc/20261116-150956.txt
      capturada: 2026-11-16
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-16, resultado: coincide}
      evidencia: "Se otorgará 10% de bonificación al acumular compras diferidas a partir de 9 Meses sin Intereses"
      nota: "Walmart la menciona solo para decir que no se acumula con la exclusiva WM INVEX (comercio-walmart-tyc)."

