# Promociones bancarias y de medios de pago de El Palacio de Hierro, Buen Fin 2026.
# Origen: elpalaciodehierro.com/promociones-bancarias.html (47 tarjetas de promoción, capturadas el 16 nov 2026)
# y el PDF de T&C "Gana en el Buen Fin" (El-fin-en-el-palacio.pdf, 65 pp.), que detalla la Tarjeta Palacio;
# las mecánicas bancarias salen de las páginas de cada banco (snapshots banco-*), citadas en fuente.nota.
#
# No se capturan como promoción (no son un beneficio que el motor sume; van en avisos):
# - Tarjetas de solo MSI: Tarjeta Palacio hasta 18 MSI (hogar y tecnología), 15 MSI (ropa, calzado y accesorios),
#   12 MSI en Belleza desde $5,990 (6 MSI desde $2,990), 12 MSI los martes; bancos participantes (Amex, BBVA, Banamex,
#   Santander, Banorte, HSBC, Scotiabank, INVEX, BanBajío, RappiCard, Nu, Falabella) hasta 15 MSI en hogar y tecnología
#   y 12 MSI en moda y belleza desde $5,990 (T&C: ropa, calzado y accesorios desde $5,000); PayPal hasta 18 MSI desde
#   $3,499 en artículos seleccionados.
# - "Hasta 60% de descuento" con cualquier forma de pago: ya viene en el precio etiquetado de cada producto.
# - Puntos dobles los jueves (no hay jueves en el evento) y Kueski "pagos quincenales" (sin beneficio).
promociones:
  # ---------------- Tarjeta Palacio ----------------
  - id: ph-palacio-bonificacion
    nombre: Bonificación Tarjeta Palacio a MSI (10%, 15% o 20%)
    comercio: palacio-de-hierro
    patrocinador: palacio-de-hierro
    campana: palacio-bf26-bonificacion
    instrumentos: [palacio.tarjeta]
    vigencia: {desde: 2026-11-13, hasta: 2026-11-15}
    beneficio:
      tipo: bonificacion
      forma: monedero
      tope: 10000
      certeza: condicionado
      tramos:
        - {desde: 30000, pct: 20}
        - {desde: 20000, pct: 15}
        - {desde: 5000, pct: 10}
      escala_acumulada: true
    condiciones:
      plazos: {min: 12}
    avisos:
      - "Limitado a 6,500 bonificaciones en total y a una bonificación por cliente (máximo $10,000)"
      - "El monto puede ser de un solo ticket o acumulado del 13 al 15 de noviembre; obligatorio a partir de 12 MSI"
      - "Llega como reembolso en la Tarjeta Palacio, usable en compras del 26 nov al 24 dic 2026; después se cancela"
      - "La tarjeta de la página dice 20% desde $30,000 del 13 al 17 nov; el T&C dice 10/15/20% del 13 al 15 nov (se usa el T&C)"
      - "10% adicional si además compras un Seguro Palacio o una Garantía Palacio (garantía mínima $3,000) tras una compra mínima de $5,000; no se modela"
      - "Del 16 al 17 nov, compras de $5,000 o más ($3,000 solo en Belleza) con Tarjeta Palacio generan Triples Puntos Palacio; no se modela porque el T&C no da el valor del punto"
      - "No participan Pago de Servicios, Superboletos, Estacionamientos, Viajes Palacio, boletos de avión, Palacio Outlet, Seguros ni Garantías"
      - "No acumulable con otras promociones de puntos, descuentos o MSI de la Tarjeta Palacio"
      - "MSI con Tarjeta Palacio: hasta 18 en hogar y tecnología, 15 en ropa, calzado y accesorios, 12 en Belleza desde $5,990"
    fuente:
      url: "https://www.elpalaciodehierro.com/on/demandware.static/-/Library-Sites-palacio-content-global/default/PDF/Informativas/Terminos-y-condiciones/El-fin-en-el-palacio.pdf"
      snapshot: snapshots/buen-fin-2026/comercio-palacio-tyc/20261116-151244.txt
      capturada: 2026-11-16
      revisada: false
      verificacion: {por: agente, fecha: 2026-11-16, resultado: corregida, notas: "Se agrega campana palacio-bf26-bonificacion y escala_acumulada: true: el T&C (comercio-palacio-tyc/20261116-151244.txt) dice que el monto mínimo aplica en una sola exhibición o acumulado del 13 al 15 nov. Porcentajes 10/15/20%, a partir de 12 MSI, tope $10,000 y vigencia 13-15 coinciden con el T&C"}
      evidencia: "Compras de $30,000.00 (treinta mil pesos 00/100 M.N.) o más| Obtendrá una bonificación del 20%"
      nota: "Tarjeta 4 de snapshots/buen-fin-2026/comercio-palacio/20261116-151140.txt: \"OBTÉN 20 % bonificación Comprando $30,000 o más, sujeto a disponibilidad\""

