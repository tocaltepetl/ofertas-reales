    condiciones:
      plazos: {permitidos: [12]}
    excluye: [wm-bf-wb18cyber26]
    avisos:
      - "Solo productos participantes (los marca la propia página)"
      - "Mínimo y tope desconocidos: la página no los muestra y no se capturó el T&C"
    fuente:
      url: "https://www.walmart.com.mx/content/especiales/beneficios-walmart/360013_2480003"
      snapshot: snapshots/black-friday-2026/comercio-walmart/20261125-182707.txt
