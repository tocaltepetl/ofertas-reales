name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci
      - run: npm run validar
      - run: npm test
      - run: npm run typecheck
      - name: docs/pendientes.md está al día
        run: |
          npm run -s pendientes
          git diff --exit-code docs/pendientes.md || { echo "Corre 'npm run pendientes' y sube docs/pendientes.md"; exit 1; }
